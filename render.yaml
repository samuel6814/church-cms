# Render Blueprint — API via Docker (do NOT use Render "Native" PHP environment).
# Frontend: Vercel (npm run build:spa). See docs/DEPLOYMENT.md.

services:
  - type: web
    name: church-cms-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: WIS-CMS
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: AUTORUN_LARAVEL_MIGRATION
        value: "true"
      - key: PHP_OPCACHE_ENABLE
        value: "1"
      - key: DB_CONNECTION
        value: pgsql
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "false"
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: CRON_TOKEN
        sync: false
